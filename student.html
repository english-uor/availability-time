<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Teacher Availability — Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E; --ink-soft:#57628A; --paper:#F5F3EC; --line:#E2DDCE;
    --card:#FFFFFF; --gold:#B8862E; --gold-soft:#F1E4C2; --forest:#2F6B4F;
    --forest-soft:#DEEEE5; --rust:#B33A2E; --rust-soft:#F7E1DD; --radius:12px;
    --shadow:0 1px 2px rgba(22,33,62,.06),0 6px 20px rgba(22,33,62,.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.45;}
  html[dir="rtl"] body,html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] button,html[dir="rtl"] input,html[dir="rtl"] select{font-family:'Vazirmatn','Inter',sans-serif;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0 0 4px;color:var(--ink);}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:'Vazirmatn',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  a{color:var(--gold);}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 64px;}
  .topbar{border-bottom:1px solid var(--line);background:var(--card);}
  .topbar-inner{max-width:880px;margin:0 auto;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;flex-direction:column;}
  .brand .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .brand h1{font-size:20px;}
  #langToggle{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  #langToggle:hover{border-color:var(--gold);color:var(--gold);}
  #banner{display:none;background:var(--rust-soft);color:var(--rust);font-size:13px;padding:10px 16px;text-align:center;font-weight:600;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:20px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  .controls input[type=text],.controls select{
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .search-wrap{position:relative;flex:2;min-width:180px;}
  #searchInput{width:100%;}
  #deptFilter{flex:1;min-width:140px;}
  input:focus,select:focus,button:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
    border-radius:8px;box-shadow:var(--shadow);max-height:280px;overflow-y:auto;z-index:20;list-style:none;margin:0;padding:6px;}
  .dropdown[hidden]{display:none;}
  .dropdown li{padding:9px 12px;border-radius:6px;cursor:pointer;}
  .dropdown li:hover,.dropdown li.active{background:var(--gold-soft);}
  .dropdown .dname{font-weight:600;font-size:14px;color:var(--ink);}
  .dropdown .dmeta{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .toggle-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;background:#fff;user-select:none;}
  .toggle-chip.on{border-color:var(--forest);color:var(--forest);background:var(--forest-soft);}
  .toggle-chip input{display:none;}

  #listView .card{padding:0;overflow:hidden;}
  .list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;}
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--paper);}
  .list-row .name{font-weight:600;font-size:15px;}
  .list-row .meta{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;flex-shrink:0;}
  .badge-on{background:var(--forest-soft);color:var(--forest);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--forest);}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:40px 20px;}

  .back-btn{border:none;background:transparent;color:var(--ink-soft);font-size:14px;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;}
  .back-btn:hover{color:var(--gold);}
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .detail-head .dept{color:var(--ink-soft);font-size:14px;margin-top:2px;}
  .notice-banner{background:var(--rust-soft);color:var(--rust);border-radius:8px;padding:12px 14px;margin-top:16px;font-size:14px;}
  .notice-banner + .notice-banner{margin-top:8px;}
  .contact-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
  .contact-row a,.contact-row span{font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 14px;color:var(--ink);text-decoration:none;background:#fff;}
  .contact-row a:hover{border-color:var(--gold);color:var(--gold);}
  .day-block{border-top:1px solid var(--line);padding:14px 0;}
  .day-block:first-of-type{border-top:none;}
  .day-name{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .slots{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--gold-soft);border-radius:999px;padding:7px 14px;font-size:13px;}
  .chip .loc{color:var(--ink-soft);margin-inline-start:6px;}
  .footlinks{margin-top:24px;text-align:center;font-size:13px;color:var(--ink-soft);}
  #detailView{display:none;}
</style>
</head>
<body>

<div id="banner"></div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="eyebrow" data-i18n="uni">University of Raparin</span>
      <h1 data-i18n="appTitle">Find Your Teacher</h1>
    </div>
    <button id="langToggle" type="button">English</button>
  </div>
</div>

<div class="wrap">

  <!-- LIST -->
  <section id="listView">
    <div class="controls">
      <div class="search-wrap">
        <input id="searchInput" type="text" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" data-i18n-ph="searchPlaceholder" placeholder="Search by name…">
        <ul id="searchDropdown" class="dropdown" role="listbox" hidden></ul>
      </div>
      <select id="deptFilter"></select>
      <label class="toggle-chip" id="availToggleLabel">
        <input type="checkbox" id="availToggle">
        <span class="dot"></span>
        <span data-i18n="availableNowFilter">Available now</span>
      </label>
    </div>
    <div class="card" id="listCard"></div>
  </section>

  <!-- DETAIL -->
  <section id="detailView">
    <button class="back-btn" id="backBtn">← <span data-i18n="back">Back to list</span></button>
    <div class="card">
      <div class="detail-head">
        <div>
          <h2 id="dName">—</h2>
          <div class="dept" id="dMeta">—</div>
        </div>
        <span class="badge badge-on" id="dBadge" style="display:none"><span class="dot" style="background:var(--forest)"></span><span data-i18n="inOfficeNow">In office now</span></span>
      </div>

      <div id="dNotices"></div>

      <div class="contact-row" id="dContact"></div>

      <h3 style="margin-top:26px" data-i18n="scheduleTitle">Weekly schedule</h3>
      <div id="dSchedule"></div>
    </div>
    <p class="footlinks" data-i18n="shareHint">Tip: this page's link is shareable — bookmark it or send it directly.</p>
  </section>

  <p class="footlinks" id="teacherLinkFoot"><a href="index.html" data-i18n="teacherLink">Are you a teacher? Log in here →</a></p>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwJJEoF3Tqu5Xae5ISy48Jc5gDmu4wBlmo5Jm4QakCjwtIm0adJ-tQmUd5nAnKjyGrd-Q/exec';

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_LABEL = {
  en: {Sunday:'Sunday',Monday:'Monday',Tuesday:'Tuesday',Wednesday:'Wednesday',Thursday:'Thursday',Friday:'Friday',Saturday:'Saturday'},
  ku: {Sunday:'یەکشەمە',Monday:'دووشەمە',Tuesday:'سێشەمە',Wednesday:'چوارشەمە',Thursday:'پێنجشەمە',Friday:'هەینی',Saturday:'شەممە'}
};

const T = {
  en: {
    uni:'University of Raparin', appTitle:'Find Your Teacher',
    searchPlaceholder:'Search by name…', deptAll:'All departments',
    availableNowFilter:'Available now', noResults:'No teachers match your search.',
    back:'Back to list', inOfficeNow:'In office now', scheduleTitle:'Weekly schedule',
    noSchedule:'No published schedule yet.', shareHint:"Tip: this page's link is shareable — bookmark it or send it directly.",
    teacherLink:'Are you a teacher? Log in here →', configWarn:'Set GAS_URL near the top of this file before using the app.',
    genericErr:'Could not load the directory. Check your connection and reload.', email:'Email', call:'Call', office:'Office'
  },
  ku: {
    uni:'زانکۆی ڕاپەرین', appTitle:'مامۆستاکەت بدۆزەرەوە',
    searchPlaceholder:'گەڕان بە ناو…', deptAll:'هەموو بەشەکان',
    availableNowFilter:'ئێستا ئامادەیە', noResults:'هیچ مامۆستایەک لەگەڵ گەڕانەکەت ناگونجێت.',
    back:'گەڕانەوە بۆ لیستە', inOfficeNow:'ئێستا لە ژوورە', scheduleTitle:'خشتەی هەفتانە',
    noSchedule:'هێشتا خشتەیەک بڵاو نەکراوەتەوە.', shareHint:'ئامۆژگاری: لینکی ئەم پەڕەیە دابەشکراوە — دەتوانیت هەڵیبگریت یان ڕاستەوخۆ بینێریت.',
    teacherLink:'مامۆستایت؟ لێرە بچۆرەژوورەوە ←', configWarn:'پێش بەکارهێنانی ئەپەکە، GAS_URL لە سەرەوەی ئەم فایلە دابنێ.',
    genericErr:'ناتوانرێت لیستەکە باربکرێت. پەیوەندی ئینتەرنێتەکەت بپشکنە و پەڕەکە نوێ بکەرەوە.', email:'ئیمەیل', call:'پەیوەندی', office:'ژووری کار'
  }
};

let lang = 'ku';
let allTeachers = [];
let currentId = null;

function tr(key){ return T[lang][key] || key; }

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ku' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = tr(el.dataset.i18nPh); });
  document.getElementById('langToggle').textContent = lang === 'ku' ? 'English' : 'کوردی';
  renderDeptOptions();
  if (typeof renderDropdown === 'function') renderDropdown();
  if (currentId){ renderDetail(currentId); } else { applyFilters(); }
}

document.getElementById('langToggle').addEventListener('click', function(){
  lang = lang === 'ku' ? 'en' : 'ku';
  applyLang();
});

function isAvailableNow(slots){
  const now = new Date();
  const day = DAYS[now.getDay()];
  const hm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  return (slots || []).some(function(s){ return s.day === day && hm >= s.start && hm < s.end; });
}

/* ---------- LOAD ---------- */

async function loadTeachers(){
  const res = await fetch(GAS_URL + '?action=getTeachers');
  allTeachers = await res.json();
}

/* ---------- LIST VIEW ---------- */

function renderDeptOptions(){
  const sel = document.getElementById('deptFilter');
  const depts = Array.from(new Set(allTeachers.map(function(t){ return t.department; }).filter(Boolean)));
  const current = sel.value;
  sel.innerHTML = '';
  const allOpt = document.createElement('option');
  allOpt.value = ''; allOpt.textContent = tr('deptAll');
  sel.appendChild(allOpt);
  depts.forEach(function(d){
    const o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o);
  });
  sel.value = depts.indexOf(current) !== -1 ? current : '';
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const dept = document.getElementById('deptFilter').value;
  const onlyAvail = document.getElementById('availToggle').checked;
  const filtered = allTeachers.filter(function(t){
    const name = (lang==='ku' ? (t.nameKu||t.nameEn) : (t.nameEn||t.nameKu) || '').toLowerCase();
    const matchesQ = !q || name.indexOf(q) !== -1 || (t.nameEn||'').toLowerCase().indexOf(q)!==-1 || (t.nameKu||'').toLowerCase().indexOf(q)!==-1;
    const matchesDept = !dept || t.department === dept;
    const matchesAvail = !onlyAvail || isAvailableNow(t.slots);
    return matchesQ && matchesDept && matchesAvail;
  });
  renderList(filtered);
}

function renderList(list){
  const card = document.getElementById('listCard');
  card.innerHTML = '';
  if (!list.length){
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = tr('noResults');
    card.appendChild(p);
    return;
  }
  list.forEach(function(t){
    const row = document.createElement('div');
    row.className = 'list-row';
    const left = document.createElement('div');
    const name = document.createElement('div'); name.className = 'name';
    name.textContent = (lang==='ku' ? (t.nameKu||t.nameEn) : (t.nameEn||t.nameKu));
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = [t.department, t.office].filter(Boolean).join(' · ');
    left.appendChild(name); left.appendChild(meta);
    row.appendChild(left);
    if (isAvailableNow(t.slots)){
      const badge = document.createElement('span');
      badge.className = 'badge badge-on';
      badge.innerHTML = '<span class="dot"></span>' + tr('inOfficeNow');
      row.appendChild(badge);
    }
    row.addEventListener('click', function(){ openDetail(t.id); });
    card.appendChild(row);
  });
}

/* ---------- SEARCH AUTOCOMPLETE ---------- */

let ddMatches = [];
let ddActive = -1;

function nameOf(t){ return lang === 'ku' ? (t.nameKu || t.nameEn) : (t.nameEn || t.nameKu); }

function computeMatches(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  return allTeachers.filter(function(t){
    return (t.nameEn || '').toLowerCase().indexOf(q) !== -1 || (t.nameKu || '').toLowerCase().indexOf(q) !== -1;
  }).slice(0, 8);
}

function renderDropdown(){
  const dd = document.getElementById('searchDropdown');
  const input = document.getElementById('searchInput');
  dd.innerHTML = '';
  if (!ddMatches.length){
    dd.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    return;
  }
  ddMatches.forEach(function(t, i){
    const li = document.createElement('li');
    li.setAttribute('role', 'option');
    if (i === ddActive) li.classList.add('active');
    const nm = document.createElement('div'); nm.className = 'dname'; nm.textContent = nameOf(t);
    const mt = document.createElement('div'); mt.className = 'dmeta';
    mt.textContent = [t.department, t.office].filter(Boolean).join(' · ');
    li.appendChild(nm); li.appendChild(mt);
    li.addEventListener('mousedown', function(e){ e.preventDefault(); selectTeacher(t.id); });
    dd.appendChild(li);
  });
  dd.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

function selectTeacher(id){
  document.getElementById('searchDropdown').hidden = true;
  document.getElementById('searchInput').value = '';
  ddMatches = []; ddActive = -1;
  applyFilters();
  openDetail(id);
}

document.getElementById('searchInput').addEventListener('input', function(){
  ddMatches = computeMatches(this.value);
  ddActive = -1;
  renderDropdown();
  applyFilters();
});

document.getElementById('searchInput').addEventListener('keydown', function(e){
  if (document.getElementById('searchDropdown').hidden) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); ddActive = Math.min(ddActive + 1, ddMatches.length - 1); renderDropdown(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); ddActive = Math.max(ddActive - 1, 0); renderDropdown(); }
  else if (e.key === 'Enter'){
    if (ddActive >= 0 && ddMatches[ddActive]){ e.preventDefault(); selectTeacher(ddMatches[ddActive].id); }
    else if (ddMatches.length === 1){ e.preventDefault(); selectTeacher(ddMatches[0].id); }
  } else if (e.key === 'Escape'){
    document.getElementById('searchDropdown').hidden = true;
  }
});

document.getElementById('searchInput').addEventListener('focus', function(){
  if (ddMatches.length) renderDropdown();
});

document.getElementById('searchInput').addEventListener('blur', function(){
  setTimeout(function(){ document.getElementById('searchDropdown').hidden = true; }, 150);
});

document.getElementById('deptFilter').addEventListener('change', applyFilters);
document.getElementById('availToggle').addEventListener('change', function(){
  document.getElementById('availToggleLabel').classList.toggle('on', this.checked);
  applyFilters();
});

/* ---------- DETAIL VIEW ---------- */

function openDetail(id){
  currentId = id;
  history.pushState({}, '', '?teacher=' + encodeURIComponent(id));
  renderDetail(id);
  showView('detail');
}

function renderDetail(id){
  const t = allTeachers.find(function(x){ return x.id === id; });
  if (!t){ showList(); return; }

  document.getElementById('dName').textContent = (lang==='ku' ? (t.nameKu||t.nameEn) : (t.nameEn||t.nameKu));
  document.getElementById('dMeta').textContent = [t.department, t.office].filter(Boolean).join(' · ');
  document.getElementById('dBadge').style.display = isAvailableNow(t.slots) ? 'inline-flex' : 'none';

  const notices = document.getElementById('dNotices');
  notices.innerHTML = '';
  (t.notices||[]).forEach(function(n){
    const b = document.createElement('div');
    b.className = 'notice-banner';
    b.textContent = n.message;
    notices.appendChild(b);
  });

  const contact = document.getElementById('dContact');
  contact.innerHTML = '';
  if (t.email){
    const a = document.createElement('a'); a.href = 'mailto:' + t.email; a.textContent = tr('email') + ': ' + t.email;
    contact.appendChild(a);
  }
  if (t.phone){
    const a = document.createElement('a'); a.href = 'tel:' + t.phone.replace(/\s+/g,''); a.textContent = tr('call') + ': ' + t.phone;
    contact.appendChild(a);
  }
  if (t.office){
    const s = document.createElement('span'); s.textContent = tr('office') + ': ' + t.office;
    contact.appendChild(s);
  }

  const sched = document.getElementById('dSchedule');
  sched.innerHTML = '';
  const daysWithSlots = DAYS.filter(function(d){ return (t.slots||[]).some(function(s){ return s.day === d; }); });
  if (!daysWithSlots.length){
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = tr('noSchedule');
    sched.appendChild(p);
  } else {
    daysWithSlots.forEach(function(day){
      const block = document.createElement('div');
      block.className = 'day-block';
      const name = document.createElement('div'); name.className = 'day-name'; name.textContent = DAY_LABEL[lang][day];
      block.appendChild(name);
      const slotsEl = document.createElement('div'); slotsEl.className = 'slots';
      t.slots.filter(function(s){ return s.day === day; }).forEach(function(s){
        const chip = document.createElement('div'); chip.className = 'chip';
        chip.innerHTML = '<span class="mono">'+s.start+'–'+s.end+'</span>' + (s.location ? '<span class="loc">· '+s.location+'</span>' : '');
        slotsEl.appendChild(chip);
      });
      block.appendChild(slotsEl);
      sched.appendChild(block);
    });
  }
}

document.getElementById('backBtn').addEventListener('click', function(){ showList(); history.pushState({}, '', location.pathname); });

function showView(which){
  document.getElementById('listView').style.display = which === 'list' ? 'block' : 'none';
  document.getElementById('detailView').style.display = which === 'detail' ? 'block' : 'none';
  document.getElementById('teacherLinkFoot').style.display = which === 'list' ? 'block' : 'none';
}

function showList(){ currentId = null; showView('list'); }

window.addEventListener('popstate', function(){
  const id = new URLSearchParams(location.search).get('teacher');
  if (id){ currentId = id; renderDetail(id); showView('detail'); }
  else { showList(); }
});

/* ---------- INIT ---------- */

async function init(){
  if (GAS_URL.indexOf('PASTE_YOUR_WEB_APP_URL_HERE') !== -1){
    const b = document.getElementById('banner');
    b.textContent = T.en.configWarn + ' / ' + T.ku.configWarn;
    b.style.display = 'block';
  }
  try{
    await loadTeachers();
  } catch(e){
    document.getElementById('listCard').innerHTML = '<div class="empty">' + T.en.genericErr + '<br>' + T.ku.genericErr + '</div>';
  }
  applyLang();
  const qId = new URLSearchParams(location.search).get('teacher');
  if (qId){ currentId = qId; renderDetail(qId); showView('detail'); } else { showView('list'); }
}

init();
</script>
</body>
</html>
